{% extends 'base.html' %}

{% block title %}Login - Music Streaming App{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
    <div class="bg-gradient-to-r from-primary to-secondary py-4 px-6">
        <h2 class="text-2xl font-bold text-white">Login</h2>
    </div>
    
    <div class="p-6">
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="mb-4 p-4 bg-red-100 text-red-700 rounded-md">
                    <p>Your username and password didn't match. Please try again.</p>
                </div>
            {% endif %}
            
            <div class="mb-4">
                <label for="id_username" class="block text-gray-700 font-medium mb-2">Username</label>
                <input type="text" name="username" id="id_username" required 
                       class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            
            <div class="mb-6">
                <label for="id_password" class="block text-gray-700 font-medium mb-2">Password</label>
                <input type="password" name="password" id="id_password" required 
                       class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <input type="checkbox" name="remember" id="remember" class="mr-2">
                    <label for="remember" class="text-gray-700">Remember me</label>
                </div>
                <a href="#" class="text-primary hover:underline">Forgot password?</a>
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary text-white py-2 px-4 rounded-md hover:opacity-90 transition">
                Login
            </button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">Don't have an account? <a href="{% url 'register' %}" class="text-primary hover:underline">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
